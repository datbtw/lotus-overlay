name: pkgcheck
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgcore/pkgcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gentoo/gentoo
          path: gentoo
      - run: mkdir -p /var/db/repos && cp -r gentoo /var/db/repos/gentoo
      - run: mkdir -p /etc/portage/repos.conf
      - run: |
          echo "[gentoo]" > /etc/portage/repos.conf/gentoo.conf
          echo "location = /var/db/repos/gentoo" >> /etc/portage/repos.conf/gentoo.conf
          echo "masters = gentoo" >> /etc/portage/repos.conf/gentoo.conf
      - run: |
          echo "[lotus-overlay]" > /etc/portage/repos.conf/lotus-overlay.conf
          echo "location = /__w/lotus-overlay/lotus-overlay" >> /etc/portage/repos.conf/lotus-overlay.conf
          echo "masters = gentoo" >> /etc/portage/repos.conf/lotus-overlay.conf
      - run: pkgcheck scan app-i18n/fcitx5-lotus --keywords=-RedundantVersion,-NonsolvableDepsInStable
