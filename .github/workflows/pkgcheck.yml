name: Gentoo pkgcheck
on: [push, pull_request]

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pkgcheck
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: --commits origin/main..HEAD
