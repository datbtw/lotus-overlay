name: pkgcheck
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pkgcore/pkgcheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gentoo/gentoo
          path: gentoo
      - run: sudo mkdir -p /var/db/repos && sudo mv gentoo /var/db/repos/gentoo
      - run: pkgcheck scan app-i18n/fcitx5-lotus --keywords=-RedundantVersion,-NonsolvableDepsInStable
